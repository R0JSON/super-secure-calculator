name: Security Pipeline (SAST & DAST)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions: read-all

jobs:
  # ------------------------------------------------------------------
  # 1. SAST: Statyczna analiza kodu (Trivy)
  # ------------------------------------------------------------------
  sast-scan:
    name: SAST Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy Result to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ------------------------------------------------------------------
  # 2a. API SCAN: Skanowanie Backend (Parallel)
  # ------------------------------------------------------------------
  api-scan:
    name: API Security Scan (ZAP)
    needs: sast-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Do tworzenia zgłoszeń
      checks: write
      actions: write # Naprawa błędu autoryzacji artefaktów

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat <<EOF > .env
          DOMAIN=localhost
          ENVIRONMENT=local
          PROJECT_NAME=SuperSecureCalc
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=changethis123
          SECRET_KEY=super-secret-test-key-change-me
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=admin12345
          BACKEND_CORS_ORIGINS=["http://localhost:3000", "http://localhost:8080"]
          FRONTEND_HOST=localhost
          FRONTEND_PORT=3000
          SENTRY_DSN=
          EOF

      - name: Start Environment
        run: |
          docker compose up -d --build
          echo "⏳ Waiting for backend to be ready..."
          sleep 45

      - name: Check OpenAPI accessibility
        run: curl -v http://localhost:8080/api/v1/openapi.json || exit 1

      # Uruchamiamy skaner API
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        continue-on-error: true # IGNORUJEMY BŁĘDY WEWNĘTRZNEGO UPLOADU
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "http://localhost:8080/api/v1/openapi.json"
          format: "openapi"
          fail_action: false
          allow_issue_writing: true
          # Usunąłem 'artifact_name', zrobimy to ręcznie poniżej

      # Ręczny upload raportu - to zawsze działa
      - name: Upload API Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report-api
          path: report_html.html

      - name: Stop Environment
        if: always()
        run: docker compose down

  # ------------------------------------------------------------------
  # 2b. DAST SCAN: Skanowanie Frontend (Parallel)
  # ------------------------------------------------------------------
  dast-scan:
    name: DAST Scan (OWASP ZAP)
    needs: sast-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat <<EOF > .env
          DOMAIN=localhost
          ENVIRONMENT=local
          PROJECT_NAME=SuperSecureCalc
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=changethis123
          SECRET_KEY=super-secret-test-key-change-me
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=admin12345
          BACKEND_CORS_ORIGINS=["http://localhost:3000", "http://localhost:8080"]
          FRONTEND_HOST=localhost
          FRONTEND_PORT=3000
          SENTRY_DSN=
          EOF

      - name: Start Environment
        continue-on-error: true
        run: |
          docker compose up -d --build
          echo "⏳ Waiting for services to stabilize..."
          sleep 45

      - name: Check Connectivity
        run: |
          curl -v http://localhost:3000 || exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "http://localhost:3000"
          fail_action: false
          cmd_options: "-a"
          allow_issue_writing: true

      - name: Upload Frontend Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report-frontend
          path: report_html.html

      - name: Stop Environment
        if: always()
        run: docker compose down

  # ------------------------------------------------------------------
  # 3. Podpisywanie Artefaktów (Cosign)
  # ------------------------------------------------------------------
  sign-release:
    name: Sign Release Artifact
    needs:
      - dast-scan
      - api-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.3.0

      - name: Create Release Archive
        run: tar -czvf release.tar.gz backend frontend docker-compose.yml

      - name: Sign Artifact (Keyless)
        run: |
          cosign sign-blob --yes release.tar.gz --output-certificate release.crt --output-signature release.sig

      - name: Upload Signed Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-package
          path: |
            release.tar.gz
            release.crt
            release.sig
