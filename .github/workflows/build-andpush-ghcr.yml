name: Build, Push and Deploy Backend

on:
  push:
    branches:
      - master

env:
  # Standard environment variables
  ENVIRONMENT: staging
  DOMAIN: ${{ secrets.DOMAIN_STAGING }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
  FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

  # Azure Container Registry configuration
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}  # np. myregistry.azurecr.io
  IMAGE_NAME: ssc-backend

jobs:
  build_and_push:
    name: Build and Push Backend to ACR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image_full: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      ### 1. Log in to Azure (to daje dostęp do ACR)
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      ### 2. Log in to ACR using Azure CLI (bez username/password)
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_REGISTRY }}

      ### 3. Build and Tag Image
      - name: Build and Tag Docker image
        id: docker_build
        run: |
          # Define dynamic tags
          SHA_TAG=${{ github.sha }}
          TIME_TAG=$(date +%s)
          
          echo "SHA_TAG=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "TIME_TAG=${TIME_TAG}" >> $GITHUB_OUTPUT

          # ACR tags
          ACR_SHA_TAG=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}
          ACR_TIME_TAG=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${TIME_TAG}
          ACR_LATEST_TAG=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          echo "Building ACR images:"
          echo " - ${ACR_SHA_TAG}"
          echo " - ${ACR_TIME_TAG}" 
          echo " - ${ACR_LATEST_TAG}"

          # Build with ACR tags
          docker build ./backend \
            --file backend/Dockerfile \
            --tag $ACR_SHA_TAG \
            --tag $ACR_TIME_TAG \
            --tag $ACR_LATEST_TAG

      ### 4. Push to ACR
      - name: Push Docker image to ACR
        run: |
          SHA_TAG=${{ steps.docker_build.outputs.SHA_TAG }}
          TIME_TAG=${{ steps.docker_build.outputs.TIME_TAG }}

          echo "Pushing to ACR:"
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${TIME_TAG}
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy_to_azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build_and_push
    environment:
      name: staging
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Azure CLI extension for containerapp is available
        run: |
          az extension add --name containerapp --upgrade || echo "containerapp extension present"

      - name: Update Azure Container App image
        env:
          IMAGE_FULL: ${{ needs.build_and_push.outputs.image_full }}
        run: |
          echo "Updating Container App with image: $IMAGE_FULL"
          az containerapp update \
            --name super-sec-calc-api-app \
            --resource-group super-sec-calc-rg \
            --image "$IMAGE_FULL" \
            --query "properties.configuration"

      - name: Show latest Container App revision (verify)
        run: |
          az containerapp show \
            --name super-sec-calc-api-app \
            --resource-group super-sec-calc-rg \
            --query "{name:name, latestImage:properties.template.containers[0].image, url:properties.configuration.ingress.fqdn}" -o json
