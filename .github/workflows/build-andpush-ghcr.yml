name: Build and Push Backend to GHCR

on:
  push:
    branches:
      - master

env:
  # Standard environment variables are kept here
  ENVIRONMENT: staging
  DOMAIN: ${{ secrets.DOMAIN_STAGING }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
  FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  
  # Variables for GHCR
  REGISTRY: ghcr.io
  # Sets the image name to owner/repo/ssc-backend
  IMAGE_NAME: ${{ github.repository }}/ssc-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Crucial: Grants permission to push to GHCR
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      ### 1. Log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }} # The user who triggered the workflow
          password: ${{ secrets.GITHUB_TOKEN }} # Uses the automatic token for authentication

      ### 2. Build and Tag Image
      - name: Build and Tag Docker image
        id: docker_build
        run: |
          # Define dynamic tags based on the commit SHA and a Unix timestamp
          SHA_TAG=${{ github.sha }}
          TIME_TAG=$(date +%s)
          
          # Define the full image paths
          FULL_IMAGE_SHA=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}
          FULL_IMAGE_TIME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TIME_TAG}
          
          echo "Building image: $FULL_IMAGE_SHA and $FULL_IMAGE_TIME"

          # Build and apply multiple tags at once
          docker build ./backend \
            --file backend/Dockerfile \
            --tag $FULL_IMAGE_SHA \
            --tag $FULL_IMAGE_TIME \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 

      ### 3. Push Image
      - name: Push Docker image to GHCR
        run: |
          SHA_TAG=${{ github.sha }}
          TIME_TAG=$(date +%s)
          
          # Push all three tagged versions to the registry
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TIME_TAG}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
