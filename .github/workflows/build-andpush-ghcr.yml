name: CI/CD → Build, Push to GHCR, Deploy to Azure Container Apps

on:
  push:
    branches:
      - master   # zmień na 'main' jeśli używasz main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ssc-backend   # będzie ghcr.io/<owner>/<repo>/ssc-backend

permissions:
  contents: read
  packages: write   # pozwala na push do GHCR
  id-token: write   # przydatne gdybyś używał OIDC (opcjonalnie)

jobs:
  build_and_push:
    name: Build & Push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (optional, for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (sha + latest)
        id: build_and_push
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set image variable
        run: echo "IMAGE_FULL=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_ENV

  deploy_to_azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Azure CLI extension for containerapp is available
        run: |
          az extension add --name containerapp --upgrade || echo "containerapp extension present"

      - name: Update Azure Container App image
        id: update_containerapp
        run: |
          echo "Updating Container App with image: $IMAGE_FULL"
          az containerapp update \
            --name super-sec-calc-api-app \
            --resource-group super-sec-calc-rg \
            --image "$IMAGE_FULL" \
            --query "properties.configuration"
      - name: Show latest Container App revision (verify)
        run: |
          az containerapp show \
            --name super-sec-calc-api-app \
            --resource-group super-sec-calc-rg \
            --query "{name:name, latestImage:properties.template.containers[0].image, url:properties.configuration.ingress.fqdn}" -o json
