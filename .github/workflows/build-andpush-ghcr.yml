name: Build, Push and Deploy Backend

on:
  push:
    branches:
      - master
      - test

env:
  # Standard environment variables are kept here
  ENVIRONMENT: staging
  DOMAIN: ${{ secrets.DOMAIN_STAGING }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
  FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

  # Variables for GHCR
  REGISTRY: ghcr.io
  # FIX: Force everything to lowercase
  IMAGE_NAME: ${{ toLower(github.repository) }}/ssc-backend

jobs:
  build_and_push:
    name: Build and Push Backend to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_full: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      ### 1. Log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ### 2. Build and Tag Image
      - name: Build and Tag Docker image
        run: |
          # Define dynamic tags
          SHA_TAG=${{ github.sha }}
          TIME_TAG=$(date +%s)

          # Define the full image paths
          FULL_IMAGE_SHA=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}
          FULL_IMAGE_TIME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TIME_TAG}

          echo "Building image: $FULL_IMAGE_SHA"
          echo "Additional tag: $FULL_IMAGE_TIME"

          # Build and apply multiple tags at once
          docker build ./backend \
            --file backend/Dockerfile \
            --tag $FULL_IMAGE_SHA \
            --tag $FULL_IMAGE_TIME \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      ### 3. Push Image
      - name: Push Docker image to GHCR
        run: |
          SHA_TAG=${{ github.sha }}
          TIME_TAG=$(date +%s)

          # Push all three tagged versions to the registry
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TIME_TAG}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy_to_azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build_and_push
    environment:
      name: staging
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Azure CLI extension for containerapp is available
        run: |
          az extension add --name containerapp --upgrade || echo "containerapp extension present"

      - name: Update Azure Container App image
        env:
          IMAGE_FULL: ${{ needs.build_and_push.outputs.image_full }}
        run: |
          echo "Updating Container App with image: $IMAGE_FULL"
          az containerapp update \
            --name super-sec-calc-api-app \
            --resource-group super-sec-calc-rg \
            --image "$IMAGE_FULL" \
            --query "properties.configuration"

      - name: Show latest Container App revision (verify)
        run: |
          az containerapp show \
            --name super-sec-calc-api-app \
            --resource-group super-sec-calc-rg \
            --query "{name:name, latestImage:properties.template.containers[0].image, url:properties.configuration.ingress.fqdn}" -o json
