name: Build and Push Backend to GHCR

on:
push:
branches:
\- master

env:

# Standard environment variables

ENVIRONMENT: staging
DOMAIN: ${{ secrets.DOMAIN\_STAGING }}
SECRET\_KEY: ${{ secrets.SECRET\_KEY }}
FIRST\_SUPERUSER: ${{ secrets.FIRST\_SUPERUSER }}
FIRST\_SUPERUSER\_PASSWORD: ${{ secrets.FIRST\_SUPERUSER\_PASSWORD }}
POSTGRES\_PASSWORD: ${{ secrets.POSTGRES\_PASSWORD }}

# Variables for GHCR

REGISTRY: ghcr.io

# Use GitHub's built-in variables to define the image name

IMAGE\_NAME: ${{ github.repository }}/ssc-backend

jobs:
deploy:
runs-on: ubuntu-latest
permissions:
contents: read
packages: write \# Required to push to GitHub Packages/Container Registry

steps:
  - name: Checkout repository
    uses: actions/checkout@v4 # Using v4 for stability
    
  # --- Docker Login Step ---
  - name: Log in to GitHub Container Registry
    uses: docker/login-action@v3
    with:
      registry: ${{ env.REGISTRY }}
      # Use GITHUB_ACTOR as the username
      username: ${{ github.actor }}
      # Use the GITHUB_TOKEN provided by GitHub Actions for authentication
      password: ${{ secrets.GITHUB_TOKEN }}

  # --- Build and Tag Step ---
  - name: Build and Tag Docker image
    id: docker_build
    run: |
      # Define the dynamic tag based on the commit SHA and a Unix timestamp
      SHA_TAG=${{ github.sha }}
      TIME_TAG=$(date +%s)
      
      # The full image name with two tags (sha and timestamp)
      FULL_IMAGE_SHA=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}
      FULL_IMAGE_TIME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TIME_TAG}
      
      echo "Building image: $FULL_IMAGE_SHA and $FULL_IMAGE_TIME"

      docker build ./backend \
        --file backend/Dockerfile \
        --tag $FULL_IMAGE_SHA \
        --tag $FULL_IMAGE_TIME \
        --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest # Add 'latest' tag for convenience

  # --- Push Step ---
  - name: Push Docker image to GHCR
    run: |
      SHA_TAG=${{ github.sha }}
      TIME_TAG=$(date +%s)
      
      docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}
      docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TIME_TAG}
      docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
