name: Build & Deploy Frontend → Azure Static Web Apps

on:
  push:
    branches:
      - master
      - test
  pull_request:
    branches:
      - master

# Use more descriptive environment variables
env:
  APP_LOCATION: "frontend" # Location of your frontend app
  OUTPUT_LOCATION: "dist" # Build output folder, relative to APP_LOCATION
  NODE_VERSION: "18"

jobs:
  build_and_deploy_frontend:
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-ci-${{ github.ref }}
      cancel-in-progress: true

    # Set default working directory for all run steps
    defaults:
      run:
        working-directory: ${{ env.APP_LOCATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Use the built-in caching for npm
          cache: "npm"
          # Point cache to the correct package-lock.json
          cache-dependency-path: "${{ env.APP_LOCATION }}/package-lock.json"

      - name: Install dependencies
        # Use 'npm ci' for faster, more reliable installs in CI environments
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # The root of the application code
          app_location: ${{ env.APP_LOCATION }}
          # The location of the build output, relative to app_location
          output_location: ${{ env.OUTPUT_LOCATION }}
          # We built the app in a previous step
          skip_app_build: true
