name: Build & Deploy Frontend → Azure Static Web Apps

on:
  push:
    branches:
      - master
      - test
  pull_request:
    branches:
      - master

env:
  APP_DIR: frontend
  BUILD_DIR: frontend/dist # change to frontend/dist if your tool outputs 'dist'
  NODE_VERSION: "18"

jobs:
  build_and_deploy_frontend:
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json', 'frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "${{ env.BUILD_DIR }}"
          skip_app_build: true
