server {
  listen 80;

  # Hide Nginx version information
  server_tokens off;

  # Security Headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  
  # Content Security Policy
  # Added frame-ancestors 'none' and form-action 'self' as per ZAP report.
  # connect-src includes localhost:8080 for backend API calls from the frontend.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8080; font-src 'self'; frame-ancestors 'none'; form-action 'self';" always;

  # Site Isolation
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Permissions Policy
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Cache Control
  # Prevent caching to satisfy 'Storable and Cacheable Content' alert.
  # Applied globally for simplicity and security in this context.
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header Pragma "no-cache" always;

  # Serve the static React files
  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the backend service
  # This assumes your backend service is named 'backend' in docker-compose.yml
  location /api {
    proxy_pass http://backend:8000; # The service name and port from docker-compose
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}