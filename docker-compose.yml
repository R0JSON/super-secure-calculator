services:
  db:
    image: postgres:17
    restart: always
    # CIS 5.1: Not running in privileged mode
    privileged: false
    # CIS 4.2: Limit Memory (Set to your environment's needs, e.g., 2GB)
    mem_limit: 2048m
    # NOTE: user: not set. Official image runs as secure non-root user (postgres).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    # CIS 5.7: Run as non-root user (Assumes UID 1000 is available/exists)
    user: "1000"
    # CIS 5.1: Not running in privileged mode
    privileged: false
    # CIS 4.2: Limit Memory (e.g., 128MB)
    mem_limit: 128m
    ports:
      - 8081:8080
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark

  prestart:
    build:
      context: ./backend
    # CIS 5.7: Run as non-root user
    user: "1000"
    # CIS 5.1: Not running in privileged mode
    privileged: false
    # CIS 4.2: Limit Memory (e.g., 512MB)
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}

  backend:
    restart: always
    # CIS 5.7: Run as non-root user
    user: "1000"
    # CIS 5.1: Not running in privileged mode
    privileged: false
    # CIS 4.2: Limit Memory (e.g., 1024MB)
    mem_limit: 1024m
    ports:
      - 8080:8000
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: ./backend

  frontend:
    restart: always
    # CIS 5.1: Not running in privileged mode
    privileged: false
    # CIS 4.2: Limit Memory (e.g., 256MB)
    mem_limit: 256m
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid
      - /var/run:rw,noexec,nosuid
      - /var/tmp:rw,noexec,nosuid
    # Build the image from frontend directory
    build:
      context: ./frontend
      # pass the API URL to the Dockerfile at build time
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8080}/api/v1
    ports:
      # Map the host port (from .env) to the container port 80 (Nginx)
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  app-db-data:

networks:
  default:
    driver: bridge
